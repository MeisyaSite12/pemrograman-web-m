<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <!-- Added ms-auto here to push items to the right -->
          <ul class="navbar-nav ms-auto">
            <li class="nav-item me-3">
              <a class="nav-link active" aria-current="page" href="#">Masuk</a>
            </li>
            <li class="nav-item me-3">
              <a class="nav-link" href="#">Register</a>
            </li>
            <li class="nav-item dropdown me-5">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Bahasa
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Bahasa Indonesia</a></li>
                <li><a class="dropdown-item" href="#">English</a></li>
                <li><a class="dropdown-item" href="#">Français</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

<main class="container-lg my-5">
      <div class="row justify-content-center">
          <!-- Sign-up container card -->
          <div class="card border-0 shadow-sm p-4 rounded-4 bg-white">
            <!-- Title on the top-left of the container -->
            <div class="mb-4">
              <h2 class="fw-bold text-dark mb-1">Selamat Datang</h2>
              <p class="text-muted small">Sistem Informasi Manajemen</p>
            </div>

            <form action="home.html" method="GET">
              <div class="mb-3">
                <label for="emailInput" class="form-label text-secondary small fw-semibold">Email Address</label>
                <input type="email" class="form-control rounded-3 py-2" id="emailInput" placeholder="name@example.com" required>
              </div>
              <div class="mb-3">
                <label for="passwordInput" class="form-label text-secondary small fw-semibold">Password</label>
                <input type="password" class="form-control rounded-3 py-2" id="passwordInput" placeholder="Create a password" required>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary py-2 rounded-3 fw-semibold">Masuk <a href="home.html"</a></button>
              </div>
            </form>
        </div>
      </div>
    <!-- Added Bootstrap JavaScript Bundle required for dropdowns to work -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  </body>
</html>
